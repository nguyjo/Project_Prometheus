; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = sustainer

; =============================================================================
; [base] is a TEMPLATE section (not an env). Other envs inherit via "extends".
; This avoids duplicating platform/board/framework settings.
; =============================================================================
[base]
platform = teensy
board = teensy41
framework = arduino

monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter

; =============================================================================
; Booster firmware build target
; =============================================================================
[env:booster]
extends = base
build_flags =
    -Isrc/common
    -Isrc/flight
    -DBUILD_FOR_BOOSTER

; =============================================================================
; Sustainer firmware build target
; =============================================================================
[env:sustainer]
extends = base
build_flags =
    -Isrc/common
    -Isrc/flight
    -DBUILD_FOR_SUSTAINER